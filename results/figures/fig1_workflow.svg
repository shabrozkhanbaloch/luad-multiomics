<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1008" width="1120" height="1008" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Analysis workflow">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#898781"/></marker></defs>
<rect width="1120" height="1008" fill="#ffffff"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">LUAD multi-omics integration: analysis workflow</text>
<text x="40" y="66" font-size="12.5" fill="#52514e">Does omics add prognostic information to clinical covariates, and which integration method survives a missing block?</text>
<text x="40" y="98" font-size="11" font-weight="700" letter-spacing="1.2" fill="#898781">1  DATA   TCGA-LUAD, FOUR BLOCKS PER PATIENT</text>
<rect x="40" y="110" width="245" height="80" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#0b0b0b">Clinical</text>
<text x="54" y="156" font-size="12" fill="#52514e">10 covariates</text>
<text x="54" y="173" font-size="12" fill="#52514e">stage, age, sex, smoking</text>
<path d="M162.5 190 L162.5 216" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="305" y="110" width="245" height="80" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="319" y="135" font-size="14" font-weight="700" fill="#0b0b0b">Expression</text>
<text x="319" y="156" font-size="12" fill="#52514e">19,499 protein-coding genes</text>
<text x="319" y="173" font-size="12" fill="#52514e">within-sample ranks</text>
<path d="M427.5 190 L427.5 216" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="570" y="110" width="245" height="80" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="584" y="135" font-size="14" font-weight="700" fill="#0b0b0b">Mutation</text>
<text x="584" y="156" font-size="12" fill="#52514e">recurrent genes, burden,</text>
<text x="584" y="173" font-size="12" fill="#52514e">10 pathway indicators</text>
<path d="M692.5 190 L692.5 216" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="835" y="110" width="245" height="80" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="849" y="135" font-size="14" font-weight="700" fill="#0b0b0b">Methylation</text>
<text x="849" y="156" font-size="12" fill="#52514e">450k array</text>
<text x="849" y="173" font-size="12" fill="#52514e">beta values</text>
<path d="M957.5 190 L957.5 216" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="40" y="220" width="1040" height="62" rx="8" fill="#f5f9fe" stroke="#9ec5f4" stroke-width="1.2"/>
<text x="54" y="245" font-size="14" font-weight="700" fill="#0b0b0b">Analysis cohort: 440 patients with an endpoint and all four blocks</text>
<text x="54" y="266" font-size="12" fill="#52514e">Primary endpoint: progression-free interval, censored at 60 months (176 events).  Sensitivity endpoint: overall survival.</text>
<path d="M560 282 L560 306" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="40" y="328" font-size="11" font-weight="700" letter-spacing="1.2" fill="#898781">2  ESTIMATION   EVERYTHING LEARNED FROM DATA IS FITTED ON TRAINING ROWS ONLY</text>
<rect x="40" y="340" width="1040" height="204" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<rect x="1002" y="350" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="1035" y="363" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">01_cv</text>
<text x="54" y="365" font-size="14" font-weight="700" fill="#0b0b0b">Nested cross-validation: 5 folds x 5 repeats, inner 5-fold tuning</text>
<rect x="56" y="378" width="326" height="150" rx="8" fill="#fafaf8" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="70" y="403" font-size="14" font-weight="700" fill="#0b0b0b">Arms: how the blocks are used</text>
<text x="70" y="424" font-size="12" fill="#52514e">One block alone</text>
<text x="70" y="441" font-size="12" fill="#52514e">Clinical + one omics block</text>
<text x="70" y="458" font-size="12" fill="#52514e">Early fusion: concatenate all four</text>
<text x="70" y="475" font-size="12" fill="#52514e">Late fusion: one model per block, risks averaged</text>
<text x="70" y="492" font-size="12" fill="#52514e">MOFA: shared latent factors + clinical</text>
<rect x="397" y="378" width="326" height="150" rx="8" fill="#fafaf8" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="411" y="403" font-size="14" font-weight="700" fill="#0b0b0b">Two model families</text>
<text x="411" y="424" font-size="12" fill="#52514e">Penalised Cox (elastic net)</text>
<text x="411" y="441" font-size="12" fill="#52514e">Random survival forest</text>
<text x="411" y="458" font-size="12" fill="#52514e"></text>
<text x="411" y="475" font-size="12" fill="#52514e">Tuned inside the fold: penalty, leaf size,</text>
<text x="411" y="492" font-size="12" fill="#52514e">block width (50 or 500 features)</text>
<rect x="738" y="378" width="326" height="150" rx="8" fill="#fafaf8" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="752" y="403" font-size="14" font-weight="700" fill="#0b0b0b">Missing at test time</text>
<text x="752" y="424" font-size="12" fill="#52514e">Nothing  ·  expression  ·  methylation  ·  mutation</text>
<text x="752" y="441" font-size="12" fill="#52514e">All omics (clinical only)</text>
<text x="752" y="458" font-size="12" fill="#52514e"></text>
<text x="752" y="475" font-size="12" fill="#52514e">Models always train on complete data;</text>
<text x="752" y="492" font-size="12" fill="#52514e">each method copes in its own way</text>
<path d="M560 544 L560 568" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="40" y="590" font-size="11" font-weight="700" letter-spacing="1.2" fill="#898781">3  INFERENCE</text>
<rect x="40" y="602" width="1040" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<rect x="1002" y="612" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="1035" y="625" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">02_boot</text>
<text x="54" y="627" font-size="14" font-weight="700" fill="#0b0b0b">Paired patient-level bootstrap, 2,000 resamples</text>
<text x="54" y="648" font-size="12" fill="#52514e">Uno's C (primary) and Harrell's C.  34 contrasts fixed in config.yaml before the run; a contrast is resolved when its 95% interval excludes zero.</text>
<path d="M560 664 L560 688" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="40" y="710" font-size="11" font-weight="700" letter-spacing="1.2" fill="#898781">4  THREE QUESTIONS</text>
<rect x="40" y="722" width="333" height="134" rx="8" fill="#f5f9fe" stroke="#9ec5f4" stroke-width="1.2"/>
<rect x="295" y="732" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="328" y="745" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">01-02</text>
<text x="54" y="747" font-size="14" font-weight="700" fill="#0b0b0b">Part 1. Prediction</text>
<text x="54" y="768" font-size="12" fill="#52514e">Does expression, mutation or</text>
<text x="54" y="785" font-size="12" fill="#52514e">methylation add to clinical covariates?</text>
<text x="54" y="802" font-size="12" fill="#52514e"></text>
<text x="54" y="819" font-size="12" fill="#52514e">Clinical + block against clinical</text>
<rect x="393" y="722" width="333" height="134" rx="8" fill="#fef6f2" stroke="#f4b79f" stroke-width="1.2"/>
<rect x="648" y="732" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="681" y="745" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">01-03</text>
<text x="407" y="747" font-size="14" font-weight="700" fill="#0b0b0b">Part 2. Integration</text>
<text x="407" y="768" font-size="12" fill="#52514e">Early, late or MOFA: which is best,</text>
<text x="407" y="785" font-size="12" fill="#52514e">and which survives a missing block?</text>
<text x="407" y="802" font-size="12" fill="#52514e"></text>
<text x="407" y="819" font-size="12" fill="#52514e">External: 3 GEO cohorts, where</text>
<text x="407" y="836" font-size="12" fill="#52514e">mutation and methylation are absent</text>
<rect x="746" y="722" width="334" height="134" rx="8" fill="#f1faf6" stroke="#9bd9c0" stroke-width="1.2"/>
<rect x="1002" y="732" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="1035" y="745" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">04-04b</text>
<text x="760" y="747" font-size="14" font-weight="700" fill="#0b0b0b">Part 3. Biology</text>
<text x="760" y="768" font-size="12" fill="#52514e">Which genes and factors are behind</text>
<text x="760" y="785" font-size="12" fill="#52514e">the models?</text>
<text x="760" y="802" font-size="12" fill="#52514e"></text>
<text x="760" y="819" font-size="12" fill="#52514e">MOFA factors, gene lists, STRING</text>
<text x="760" y="836" font-size="12" fill="#52514e">network, modules, Cytoscape</text>
<path d="M560 856 L560 880" stroke="#898781" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="40" y="902" font-size="11" font-weight="700" letter-spacing="1.2" fill="#898781">5  CHECKS AND REPORT</text>
<rect x="40" y="914" width="686" height="66" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<rect x="648" y="924" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="681" y="937" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">05_checks</text>
<text x="54" y="939" font-size="14" font-weight="700" fill="#0b0b0b">Four robustness checks</text>
<text x="54" y="960" font-size="12" fill="#52514e">Positive controls  ·  leakage and shuffled outcome  ·  block width sweep  ·  metric agreement</text>
<rect x="746" y="914" width="334" height="66" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<rect x="1002" y="924" width="66" height="18" rx="9" fill="#f0efec"/>
<text x="1035" y="937" font-size="10.5" text-anchor="middle" fill="#52514e" font-family="DejaVu Sans Mono, Menlo, monospace">06-07</text>
<text x="760" y="939" font-size="14" font-weight="700" fill="#0b0b0b">Report</text>
<text x="760" y="960" font-size="12" fill="#52514e">RESULTS.md and figures, from the tables</text>
</svg>